# Control catalog. Each check is defined once and cross-walked to every framework it
# provides evidence for. Mappings are my own judgment; verify them against the official
# crosswalks before relying on them in an audit.
#
# Frameworks: NIST SP 800-53 Rev. 5, AICPA TSC 2017 (rev. 2022), NIST AI RMF 1.0,
# OWASP Top 10 for LLM Applications 2025.

controls:
  AAR-01:
    title: Every agent has an accountable human owner
    nist_800_53: [AC-2]
    soc2: [CC6.2]
    nist_ai_rmf: [GOVERN 2.1]
    owasp_llm: []

  AAR-02:
    title: Agent access is approved and recertified within 90 days
    nist_800_53: [AC-2]
    soc2: [CC6.2, CC6.3]
    nist_ai_rmf: []
    owasp_llm: []

  AAR-03:
    title: Privileged agent actions require human approval
    nist_800_53: [AC-6]
    soc2: [CC6.3]
    nist_ai_rmf: [MAP 3.5]
    owasp_llm: [LLM06]

  AAR-04:
    title: Tool scopes follow least privilege
    nist_800_53: [AC-6]
    soc2: [CC6.3]
    nist_ai_rmf: []
    owasp_llm: [LLM06]

  AAR-05:
    title: Code and shell execution is sandboxed
    nist_800_53: [CM-7, AC-6]
    soc2: []
    nist_ai_rmf: []
    owasp_llm: [LLM05, LLM06]

  AAR-06:
    title: No credentials are hardcoded in agent configuration
    nist_800_53: [IA-5]
    soc2: [CC6.1]
    nist_ai_rmf: []
    owasp_llm: []

  AAR-07:
    title: Agent credentials are rotated within 90 days
    nist_800_53: [IA-5]
    soc2: [CC6.1]
    nist_ai_rmf: []
    owasp_llm: []

  AAR-08:
    title: Dormant agent access is removed after 90 days
    nist_800_53: [AC-2(3)]
    soc2: [CC6.2]
    nist_ai_rmf: []
    owasp_llm: []

  AAR-09:
    title: No unmitigated data exfiltration path
    nist_800_53: [AC-4]
    soc2: []
    nist_ai_rmf: [MEASURE 2.7]
    owasp_llm: [LLM01, LLM02]

  AAR-10:
    title: Tool packages are pinned to a version
    nist_800_53: [SR-3]
    soc2: []
    nist_ai_rmf: []
    owasp_llm: [LLM03]

  AAR-11:
    title: Remote tools use encrypted transport
    nist_800_53: [SC-8]
    soc2: [CC6.7]
    nist_ai_rmf: []
    owasp_llm: []

  AAR-12:
    title: Every tool's capabilities are inventoried
    nist_800_53: [CM-8]
    soc2: []
    nist_ai_rmf: [GOVERN 1.6]
    owasp_llm: []

  AAR-13:
    title: Tool servers are still maintained upstream
    nist_800_53: [SA-22, SI-2]
    soc2: [CC7.1]
    nist_ai_rmf: []
    owasp_llm: [LLM03]
