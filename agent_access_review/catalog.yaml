# Capability profiles for well-known MCP servers. An MCP config only says *which*
# server runs, not what it can do, so this catalog is how a server name becomes an
# access grant. Anything not listed here is flagged as unclassified (AAR-12) rather
# than silently assumed safe. Add your organization's internal servers here.
#
#   actions:              read | write | delete | send | execute | admin
#   data_classification:  public | internal | confidential | restricted
#   untrusted_input:      the tool returns content an outsider can author (prompt-injection source)
#   egress:               the tool can move data outside the organization
#   resource_from:        how to name the resource: paths (filesystem args) | dsn (connection string)
#   aliases:              other names the same server runs under (official Docker image, uvx name)
#   deprecated:           the package is deprecated or its repository archived: no more security fixes (AAR-13)
#   replacement:          the maintained server to move to, when one exists
#
# The reference servers moved to modelcontextprotocol/servers-archived in 2025 and their npm
# packages are marked deprecated. Status checked against the npm registry on 2026-11-11.

servers:
  "@modelcontextprotocol/server-filesystem":
    tool: filesystem
    aliases: [mcp/filesystem]
    actions: [read, write, delete]
    data_classification: confidential
    resource_from: paths

  "@modelcontextprotocol/server-github":
    tool: github
    actions: [read, write]
    data_classification: confidential
    untrusted_input: true
    egress: true
    deprecated: true
    replacement: "ghcr.io/github/github-mcp-server"

  "ghcr.io/github/github-mcp-server":
    tool: github
    actions: [read, write]
    data_classification: confidential
    untrusted_input: true
    egress: true

  "@modelcontextprotocol/server-postgres":
    tool: postgres
    aliases: [mcp/postgres]
    actions: [read]
    data_classification: restricted
    resource_from: dsn
    deprecated: true

  "@modelcontextprotocol/server-slack":
    tool: slack
    actions: [read, send]
    data_classification: confidential
    untrusted_input: true
    egress: true
    deprecated: true

  "mcp-server-fetch":
    tool: fetch
    aliases: [mcp/fetch]
    actions: [read]
    data_classification: public
    untrusted_input: true
    egress: true            # a GET to an attacker URL can carry data in the query string

  "@modelcontextprotocol/server-puppeteer":
    tool: browser
    aliases: [mcp/puppeteer]
    actions: [read, send]
    data_classification: public
    untrusted_input: true
    egress: true
    deprecated: true
    replacement: "@playwright/mcp"

  "@playwright/mcp":
    tool: browser
    actions: [read, send]
    data_classification: public
    untrusted_input: true
    egress: true

  "@wonderwhy-er/desktop-commander":
    tool: shell
    actions: [read, write, delete, execute]
    data_classification: confidential

  "mcp-shell-server":
    tool: shell
    actions: [execute]
    data_classification: confidential

  "mcp-server-git":
    tool: git
    aliases: [mcp/git]
    actions: [read, write]        # git_add, git_commit, git_reset, git_checkout, git_create_branch
    data_classification: confidential
    resource_from: paths

  "@modelcontextprotocol/server-memory":
    tool: memory
    aliases: [mcp/memory]
    actions: [read, write]
    data_classification: internal


  "mcp-server-sqlite":                 # uvx name; read_query/write_query/create_table per its README
    tool: sqlite
    actions: [read, write]
    data_classification: confidential

  "@modelcontextprotocol/server-brave-search":
    tool: brave-search
    actions: [read]                     # web/local search only
    data_classification: public
    untrusted_input: true               # search results are outsider-authored content
    egress: true                        # search queries leave the organization
    deprecated: true
    replacement: "@brave/brave-search-mcp-server"

  "@modelcontextprotocol/server-gdrive":
    tool: gdrive
    actions: [read]                     # search + read-only file access (drive.readonly OAuth scope)
    data_classification: confidential
    deprecated: true

  "@brave/brave-search-mcp-server":
    tool: brave-search
    actions: [read]
    data_classification: public
    untrusted_input: true
    egress: true

  "@modelcontextprotocol/server-redis":
    tool: redis
    aliases: [mcp/redis]
    actions: [read, write, delete]      # set, get, delete, list
    data_classification: confidential
    deprecated: true
    replacement: "redis-mcp-server"

  "redis-mcp-server":                   # redis/mcp-redis, maintained by Redis
    tool: redis
    actions: [read, write, delete]
    data_classification: confidential

  "@modelcontextprotocol/server-google-maps":
    tool: google-maps
    aliases: [mcp/google-maps]
    actions: [read]                     # geocoding, places, directions
    data_classification: public
    egress: true                        # queries go to the Maps API
    deprecated: true

  "@modelcontextprotocol/server-gitlab":
    tool: gitlab
    aliases: [mcp/gitlab]
    actions: [read, write]              # files, issues, merge requests, branches
    data_classification: confidential
    untrusted_input: true
    egress: true
    deprecated: true

  "@modelcontextprotocol/server-aws-kb-retrieval":
    tool: aws-kb-retrieval
    aliases: [mcp/aws-kb-retrieval-server]
    actions: [read]
    data_classification: confidential
    deprecated: true
    replacement: "awslabs.bedrock-kb-retrieval-mcp-server"

  "awslabs.bedrock-kb-retrieval-mcp-server":
    tool: aws-kb-retrieval
    actions: [read]
    data_classification: confidential

  "@modelcontextprotocol/server-everart":
    tool: everart
    aliases: [mcp/everart]
    actions: [read, send]               # sends prompts to EverArt, returns images
    data_classification: public
    egress: true
    deprecated: true

# Remote (HTTP/SSE) MCP servers, matched on hostname.
remote_hosts:
  "api.githubcopilot.com":
    tool: github
    actions: [read, write]
    data_classification: confidential
    untrusted_input: true
    egress: true
