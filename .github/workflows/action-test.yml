name: action-test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The bundled examples have high findings, so the gate must fail...
      - id: gate
        uses: ./
        continue-on-error: true
        with:
          paths: agent_access_review/examples
      # ...and with fail-on: never it must pass and still write the packet.
      - id: report
        uses: ./
        with:
          paths: agent_access_review/examples
          fail-on: never
          out: packet
      # A folder with no configs is a notice, not a failure.
      - uses: ./
        with:
          paths: docs
      - run: |
          test "${{ steps.gate.outcome }}" = failure
          test -s "${{ steps.report.outputs.report }}"
          test -s packet/oscal/assessment-results.json
