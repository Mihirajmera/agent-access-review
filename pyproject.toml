[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-access-review"
version = "0.2.1"
description = "User access reviews for AI agents and MCP servers, with audit evidence and OSCAL output"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Mihir Ajmera" }]
dependencies = ["pyyaml>=6.0,<7"]
keywords = ["ai-security", "ai-governance", "mcp", "access-review", "grc", "oscal", "owasp-llm-top-10"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Intended Audience :: Information Technology",
]

[project.urls]
Homepage = "https://github.com/Mihirajmera/agent-access-review"
Issues = "https://github.com/Mihirajmera/agent-access-review/issues"

[project.scripts]
agent-access-review = "agent_access_review.__main__:main"

[tool.setuptools]
packages = ["agent_access_review", "agent_access_review.examples"]

[tool.setuptools.package-data]
agent_access_review = ["*.yaml"]
"agent_access_review.examples" = ["*"]
